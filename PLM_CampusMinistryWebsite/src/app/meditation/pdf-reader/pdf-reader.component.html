<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>PDF Reader</ion-title>
    <ion-buttons slot="end" *ngIf="isPasswordCorrect">
      <ion-button (click)="selectTool('bookmark')">
        <ion-icon name="bookmark-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- Password Screen -->
  <div class="password-screen" *ngIf="!isPasswordEntered">
    <div class="password-container">
      <ion-icon name="lock-closed" class="lock-icon"></ion-icon>
      <h2>Password Required</h2>
      <p>Please enter the password to access this PDF book.</p>
      <ion-item>
        <ion-label position="stacked">Password</ion-label>
        <ion-input 
          type="password" 
          [(ngModel)]="passwordInput"
          (keyup.enter)="verifyPassword()"
          placeholder="Enter password">
        </ion-input>
      </ion-item>
      <ion-button expand="block" (click)="verifyPassword()" class="submit-button">
        Unlock PDF
      </ion-button>
    </div>
  </div>

  <!-- PDF Reader -->
  <div class="pdf-reader-container" *ngIf="isPasswordCorrect">
    <!-- Loading Indicator -->
    <div class="loading-overlay" *ngIf="isLoading">
      <ion-spinner name="crescent"></ion-spinner>
      <p>Loading PDF...</p>
    </div>
    <!-- Toolbar -->
    <div class="toolbar">
      <div class="toolbar-group">
        <ion-button fill="clear" size="small" (click)="previousPage()" [disabled]="currentPage === 1 || isLoading" [title]="'Previous Page (←)'">
          <ion-icon name="chevron-back"></ion-icon>
        </ion-button>
        <div class="page-navigation">
          <input 
            type="number" 
            class="page-input"
            [value]="currentPage"
            [min]="1"
            [max]="totalPages"
            (change)="onPageInputChange($event)"
            (keyup.enter)="onPageInputChange($event)"
            [disabled]="isLoading || totalPages === 0">
          <span class="page-separator">/</span>
          <span class="page-total">{{ totalPages }}</span>
        </div>
        <ion-button fill="clear" size="small" (click)="nextPage()" [disabled]="currentPage === totalPages || isLoading" [title]="'Next Page (→)'">
          <ion-icon name="chevron-forward"></ion-icon>
        </ion-button>
      </div>

      <div class="toolbar-group">
        <ion-button fill="clear" size="small" (click)="zoomOut()" [disabled]="isLoading || scale <= 0.5" [title]="'Zoom Out (Ctrl+-)'">
          <ion-icon name="remove"></ion-icon>
        </ion-button>
        <span class="zoom-info">{{ Math.round(scale * 100) }}%</span>
        <ion-button fill="clear" size="small" (click)="zoomIn()" [disabled]="isLoading" [title]="'Zoom In (Ctrl++)'">
          <ion-icon name="add"></ion-icon>
        </ion-button>
      </div>

      <div class="toolbar-group">
        <ion-button 
          fill="outline" 
          size="small" 
          [color]="selectedTool === 'none' ? 'primary' : 'medium'"
          (click)="selectTool('none')"
          [title]="'Deselect tool'">
          <ion-icon name="hand-left"></ion-icon>
          <span class="button-text">None</span>
        </ion-button>
        <ion-button 
          fill="outline" 
          size="small" 
          [color]="selectedTool === 'highlight' ? 'primary' : 'medium'"
          (click)="selectTool('highlight')"
          [disabled]="isLoading">
          <ion-icon name="color-fill"></ion-icon>
          <span class="button-text">Highlight</span>
        </ion-button>
        <ion-button 
          fill="outline" 
          size="small"
          [color]="selectedTool === 'pen' ? 'primary' : 'medium'"
          (click)="selectTool('pen')"
          [disabled]="isLoading">
          <ion-icon name="create"></ion-icon>
          <span class="button-text">Pen</span>
        </ion-button>
        <ion-button 
          fill="outline" 
          size="small"
          [color]="selectedTool === 'bookmark' ? 'primary' : 'medium'"
          (click)="addBookmark()"
          [disabled]="isLoading || totalPages === 0">
          <ion-icon name="bookmark"></ion-icon>
          <span class="button-text">Bookmark</span>
        </ion-button>
        <ion-button 
          fill="outline" 
          size="small"
          color="danger"
          (click)="clearAnnotations()"
          [disabled]="isLoading">
          <ion-icon name="trash"></ion-icon>
          <span class="button-text">Clear</span>
        </ion-button>
        <ion-button 
          fill="outline" 
          size="small"
          [color]="isFullscreen ? 'primary' : 'medium'"
          (click)="toggleFullscreen()"
          [title]="isFullscreen ? 'Exit Fullscreen (Esc)' : 'Enter Fullscreen (Ctrl+F)'"
          [disabled]="isLoading">
          <ion-icon [name]="isFullscreen ? 'contract' : 'expand'"></ion-icon>
          <span class="button-text">{{ isFullscreen ? 'Exit' : 'Fullscreen' }}</span>
        </ion-button>
        <ion-button 
          fill="outline" 
          size="small"
          color="success"
          (click)="saveToCache()"
          [title]="'Save annotations and bookmarks to browser cache'"
          [disabled]="isLoading">
          <ion-icon name="save"></ion-icon>
          <span class="button-text">Save</span>
        </ion-button>
      </div>
    </div>

    <!-- Color Picker for Highlight -->
    <div class="color-picker" *ngIf="selectedTool === 'highlight'">
      <ion-button 
        *ngFor="let color of highlightColors" 
        fill="clear" 
        size="small"
        [style.background-color]="color"
        [class.active]="highlightColor === color"
        (click)="highlightColor = color">
      </ion-button>
    </div>

    <!-- Color Picker for Pen -->
    <div class="color-picker" *ngIf="selectedTool === 'pen'">
      <ion-button 
        *ngFor="let color of penColors" 
        fill="clear" 
        size="small"
        [style.background-color]="color"
        [class.active]="penColor === color"
        (click)="penColor = color">
      </ion-button>
      <ion-range 
        [(ngModel)]="penSize" 
        min="1" 
        max="10" 
        step="1"
        [value]="penSize">
        <ion-label slot="start">Size</ion-label>
        <ion-label slot="end">{{ penSize }}px</ion-label>
      </ion-range>
    </div>

    <!-- PDF Canvas Container -->
    <div class="canvas-container"
         (touchstart)="onContainerTouchStart($event)"
         (touchmove)="onContainerTouchMove($event)"
         (touchend)="onContainerTouchEnd($event)"
         (touchcancel)="onContainerTouchEnd($event)">
      <div class="canvas-wrapper">
        <canvas #pdfCanvas class="pdf-canvas"></canvas>
        <canvas 
          #annotationCanvas 
          class="annotation-canvas"
          (mousedown)="onCanvasMouseDown($event)"
          (mousemove)="onCanvasMouseMove($event)"
          (mouseup)="onCanvasMouseUp($event)"
          (mouseleave)="onCanvasMouseUp($event)"
          (touchstart)="onCanvasTouchStart($event)"
          (touchmove)="onCanvasTouchMove($event)"
          (touchend)="onCanvasTouchEnd($event)"
          (touchcancel)="onCanvasTouchEnd($event)">
        </canvas>
      </div>
    </div>

    <!-- Bookmarks Sidebar -->
    <ion-fab vertical="top" horizontal="end" slot="fixed" *ngIf="bookmarks.length > 0">
      <ion-fab-button>
        <ion-icon name="bookmarks"></ion-icon>
      </ion-fab-button>
      <ion-fab-list side="bottom">
        <div class="bookmarks-list">
          <div class="bookmark-item" *ngFor="let bookmark of bookmarks">
            <ion-button fill="clear" (click)="goToBookmark(bookmark)">
              <ion-icon name="bookmark" slot="start"></ion-icon>
              {{ bookmark.title }}
            </ion-button>
            <ion-button fill="clear" color="danger" (click)="deleteBookmark(bookmark)">
              <ion-icon name="trash"></ion-icon>
            </ion-button>
          </div>
        </div>
      </ion-fab-list>
    </ion-fab>
  </div>
</ion-content>
